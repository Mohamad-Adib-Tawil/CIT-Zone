name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify generated sources
        run: python3 tool/verify_generated.py --no-fvm

      - name: Test measurement tooling
        run: python3 -m unittest discover -s test/tool -p '*_test.py' -v

      - name: Check architecture boundaries
        run: dart run tool/architecture_rules.dart

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        env:
          HASOBJY_WIDGET_OUTPUT: reports/ci
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/ci
          flutter test --reporter expanded 2>&1 | tee reports/ci/flutter-test.log

      - name: Build Android debug
        run: flutter build apk --debug

      - name: Preserve test evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-failure-evidence
          path: reports/ci/
          if-no-files-found: ignore
          retention-days: 7
