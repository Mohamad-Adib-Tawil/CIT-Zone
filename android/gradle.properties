# Default: suitable for most Flutter projects and reduces memory pressure.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Frozen alternative for very large Android/Flutter projects.
# Use only when Gradle fails with Java heap errors such as:
#   Java heap space
#   GC overhead limit exceeded
#   OutOfMemoryError
# To enable it, comment the 4G line above and uncomment this line:
# org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
